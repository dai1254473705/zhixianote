<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>更新日志 - 知夏笔记</title>
<meta name="description" content="知夏笔记的更新日志，记录每个版本的功能改进与优化。" />
<link rel="icon" type="image/png" href="assets/favicon-64x64.png" />
<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --secondary: #64748b;
  --bg-body: #ffffff;
  --bg-alt: #f8fafc;
  --text-main: #0f172a;
  --text-muted: #475569;
  --border: #e2e8f0;
  --radius-lg: 16px;
  --radius-md: 12px;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 / 0.1), 0 2px 4px -2px rgb(0 0 / 0.1);
  --container-width: 900px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text-main);
  background: var(--bg-body);
  line-height: 1.6;
}

a { text-decoration: none; color: inherit; transition: all 0.2s ease; }

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: var(--container-width);
  margin: 0 auto;
  padding: 0 24px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}
.logo img {
  width: 28px;
  height: 28px;
  border-radius: 6px;
}
.nav-links {
  display: flex;
  gap: 24px;
}
.nav-links a {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
}
.nav-links a:hover { color: var(--primary); }
.btn-back {
  padding: 6px 16px;
  background: var(--text-main);
  color: #fff !important;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
}
.btn-back:hover { background: #000; }

/* Main Content */
.changelog-section {
  padding: 60px 24px;
  max-width: var(--container-width);
  margin: 0 auto;
}
.page-title {
  text-align: center;
  margin-bottom: 48px;
}
.page-title h1 {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -0.025em;
  margin-bottom: 12px;
}
.page-title p {
  font-size: 18px;
  color: var(--text-muted);
}

/* Version Cards */
.version-card {
  background: var(--bg-alt);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  transition: all 0.2s ease;
}
.version-card:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--primary);
}
.version-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.version-number {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}
.version-date {
  font-size: 14px;
  color: var(--text-muted);
}
.version-logs {
  list-style: none;
}
.version-logs li {
  position: relative;
  padding-left: 20px;
  margin-bottom: 10px;
  font-size: 15px;
  color: var(--text-main);
}
.version-logs li::before {
  content: "→";
  position: absolute;
  left: 0;
  color: var(--primary);
  font-weight: 700;
}

/* Footer */
footer {
  border-top: 1px solid var(--border);
  padding: 32px 24px;
  text-align: center;
  background: var(--bg-alt);
}
.footer-content {
  max-width: var(--container-width);
  margin: 0 auto;
}
.footer-content p {
  font-size: 14px;
  color: var(--text-muted);
}
.footer-content a {
  color: var(--primary);
}
.footer-content a:hover { text-decoration: underline; }

/* Responsive */
@media (max-width: 768px) {
  .page-title h1 { font-size: 32px; }
  .nav-links { display: none; }
  .version-header { flex-direction: column; gap: 6px; }
}
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <img src="assets/favicon-64x64.png" alt="知夏笔记 Logo">
      知夏笔记
    </a>
    <nav class="nav-links">
      <a href="index.html#features">功能</a>
      <a href="index.html#security">数据安全</a>
      <a href="index.html#price">价格</a>
    </nav>
    <a href="index.html" class="btn-back">返回首页</a>
  </div>
</header>

<main class="changelog-section">
  <div class="page-title">
    <h1>更新日志</h1>
    <p>持续迭代，只为更好的体验。</p>
  </div>

  <div id="changelog-container">
    <!-- Changelog will be loaded here -->
  </div>
</main>

<footer>
  <div class="footer-content">
    <p>&copy; 2025-2026 知夏笔记。All rights reserved.</p>
    <p style="margin-top: 8px;">
      <a href="index.html">返回首页</a> ·
      <a href="https://www.zhixianote.cn" target="_blank">官网</a>
    </p>
  </div>
</footer>

<script src="updatelog.js"></script>
<script>
(function() {
  const container = document.getElementById('changelog-container');
  if (typeof updates === 'undefined') {
    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">加载更新日志失败，请稍后重试。</p>';
    return;
  }

  const sortedUpdates = [...updates].sort((a, b) => {
    const aNums = a.version.split('.').map(Number);
    const bNums = b.version.split('.').map(Number);
    for (let i = 0; i < Math.max(aNums.length, bNums.length); i++) {
      if ((aNums[i] || 0) !== (bNums[i] || 0)) {
        return (bNums[i] || 0) - (aNums[i] || 0);
      }
    }
    return 0;
  });

  container.innerHTML = sortedUpdates.map(v => `
    <div class="version-card">
      <div class="version-header">
        <span class="version-number">v${v.version}</span>
        <span class="version-date">${v.date}</span>
      </div>
      <ul class="version-logs">
        ${v.logs.map(log => `<li>${log}</li>`).join('')}
      </ul>
    </div>
  `).join('');
})();
</script>

</body>
</html>
